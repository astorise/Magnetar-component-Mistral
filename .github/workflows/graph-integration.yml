name: Mistral graph integration

on:
  pull_request:
  push:
    branches: [main, claude/charming-lamport-1b9m74]

permissions:
  contents: read

jobs:
  graph-and-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain and WebAssembly target
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup target add wasm32-wasip2 --toolchain 1.100.0
      - name: Exercise graph and fail-closed WIT adapter
        run: cargo +1.100.0 test --locked --features bindings
      - name: Build Component Model artifact
        run: cargo +1.100.0 build --locked --release --target wasm32-wasip2
      - name: Install wasm-tools
        uses: taiki-e/install-action@39a0b1570a117ededf7f373a25a04e92fa1994b0 # wasm-tools
      - name: Validate Component Model artifact
        run: wasm-tools validate target/wasm32-wasip2/release/magnetar_component_mistral.wasm --features component-model
