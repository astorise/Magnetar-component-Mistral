[workspace]

[package]
name = "magnetar-component-mistral"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Mistral AI model graph Component for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-component-Mistral"
readme = "README.md"
keywords = ["ai", "inference", "magnetar"]
categories = ["science", "wasm"]
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to a commit while the SDK is in development; the crate is published
# once it is stable.
magnetar-component-sdk = { git = "https://github.com/astorise/magnetar-component-sdk", rev = "9918c8a9507b20a7cb456d069bc5b3b8cf5b0bc4" }
# The contract: pinned by commit while the crate is in development, and the
# feature names the contract version this Component targets.
magnetar-component-api = { git = "https://github.com/astorise/magnetar-component-api", rev = "2383a7479ff496b147e27e294f3190d5209b39d4", features = ["v1_8"] }

[features]
bindings = []

[dev-dependencies]
serde_json = "1"
