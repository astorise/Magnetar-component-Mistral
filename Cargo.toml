[workspace]

[package]
name = "magnetar-component-mistral"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Mistral AI model graph Component for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-component-Mistral"
readme = "README.md"
keywords = ["ai", "inference", "magnetar"]
categories = ["science", "wasm"]
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to a commit while the SDK is in development; the crate is published
# once it is stable.
magnetar-component-sdk = { git = "https://github.com/astorise/magnetar-component-sdk", rev = "4e2e556176f465aa8d271259104de9e2f5aefdfa" }
wit-bindgen = "0.63"

[features]
bindings = []

[dev-dependencies]
serde_json = "1"
